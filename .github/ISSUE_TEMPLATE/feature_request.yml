name: Feature request
description: Suggest a schema type, check, option or integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to validate?
      description: The real-world data and why the current API makes it hard.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      render: ts
